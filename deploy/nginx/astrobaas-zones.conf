# AstroBaaS — shared-memory zones for the reference vhost.
#
#   sudo cp astrobaas-zones.conf /etc/nginx/conf.d/00-astrobaas-zones.conf
#
# These MUST exist before astrobaas.conf loads: limit_req_zone and
# limit_conn_zone are only valid in the http{} block, and a server block that
# references an undeclared zone makes nginx refuse to start.
#
# Copy this file ONCE per server, however many AstroBaaS vhosts it carries. The
# zones are shared by every vhost that names them, which is what you want: a
# flood aimed at two shops on one box is still one flood.
#
# UPGRADING: astrobaas_rare is new. A vhost from this release names it, so copy
# this file again BEFORE the new vhost, or `nginx -t` refuses the vhost with
# "zero size shared memory zone" — loudly, and without dropping the running
# config, but do it in that order.
#
# The numbers are measured against the reference vhost, not chosen. See the
# header of astrobaas.conf: 450 concurrent requests from one address is ONE page
# view of a 400-product catalogue page, and burst=40 rejected all 450 of them.

limit_req_zone  $binary_remote_addr zone=astrobaas_general:10m rate=50r/s;
limit_req_zone  $binary_remote_addr zone=astrobaas_login:10m   rate=30r/m;
limit_conn_zone $binary_remote_addr zone=astrobaas_conn:10m;

# Routes a person calls a handful of times a DAY: a backup restore, a WordPress
# import, a health probe from an uptime monitor. Each is either expensive
# (hundreds of megabytes parsed and written) or public and pointless to repeat.
# 10 a minute is far above any legitimate use and far below what turns them
# into a way to pin the CPU. 1m holds about 16,000 addresses.
limit_req_zone  $binary_remote_addr zone=astrobaas_rare:1m     rate=10r/m;

# limit_req_status, server_tokens and the rest are set in the vhost, at server
# level, and deliberately NOT here: this file is included into http{}, and if
# nginx.conf already sets one of them there (hardening guides often set
# server_tokens), the same directive twice in one block is a hard error that
# stops nginx from reloading.
