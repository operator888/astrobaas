# AstroBaaS — reference nginx vhost.
#
# Replace, throughout:
#   cms.example.com             the public hostname
#   /var/www/cms-example-com    the deploy base (deploy.sh's /var/www/<slug>)
#   astrobaas_cms_example_com   the upstream name — UNIQUE per vhost on a box
#   127.0.0.1:3002              the app's loopback address (the unit's PORT)
#
# Validate before reloading, every time:  sudo nginx -t && sudo systemctl reload nginx
# A failed `nginx -t` leaves the running configuration serving; a reload
# without it is how a typo becomes an outage.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE NUMBERS BELOW ARE NOT DEFAULTS. THEY ARE MEASURED.
#
# Three of three CMS hosts on one server shipped hand-written vhosts with
# `burst=40`. That number is smaller than a single page view of this
# application, so one editor opening the media picker got 503s from nginx —
# which the app never sees, cannot log, and cannot explain.
#
# What real traffic looks like, measured on a live shop:
#
#   a first-time visitor browsing 4 pages a minute   ~90 requests/minute
#   ONE page view of a 400-product catalogue page    ~450 requests, near-instant
#
# So any burst below ~500 rejects a legitimate catalogue page view, and any rate
# below ~2r/s rejects ordinary browsing. The settings here are deliberately
# generous: this limiter exists to stop a flood, NOT to police normal use. The
# application does its own per-principal limiting on /api/ (per user, per API
# key, per IP) with RateLimit-* headers a client can act on; an edge limiter
# that fires first replaces that with a bare 429.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED FIRST: the shared-memory zones.
#
# `limit_req`/`limit_conn` below reference zones that must be declared in the
# http{} block, which this file is not. Copy astrobaas-zones.conf beside this
# one — nginx REFUSES TO START with "zero size shared memory zone" until you
# do, so this is a five-minute confusion rather than a silent one, but do it
# first. (Upgrading? The zones file gained `astrobaas_rare`; copy it again.)
#
#   sudo cp astrobaas-zones.conf /etc/nginx/conf.d/00-astrobaas-zones.conf
#
# Its contents are reproduced here with the reasoning:
# ─────────────────────────────────────────────────────────────────────────────
#
# 10m of shared memory holds roughly 160,000 addresses, far more than a shop
# sees.
#
# rate=50r/s, burst=1000 was arrived at by measurement, not by taste. Against
# this exact vhost, 450 concurrent requests from one address:
#
#   burst=40   (what shipped)   450 of 450 rejected — the reported incident
#   burst=600                   450 pass; but TWO page views in quick
#                               succession (900 requests) lose 258 of them
#   burst=1000, rate=50r/s      900 pass, and a third page view five seconds
#                               later passes as well
#
# Two catalogue page views a few seconds apart is a shopper scrolling, not an
# attack, so the burst has to cover it. 50r/s still caps one address at 3,000
# requests a minute sustained.
#
#   limit_req_zone $binary_remote_addr zone=astrobaas_general:10m rate=50r/s;
#
# Concurrency is the cheaper flood control, and the one that actually protects
# a small VPS: a bounded number of simultaneous connections per address costs
# nothing to enforce and cannot reject a burst that arrives over one or two
# keep-alive connections, which is what a browser does.
#
#   limit_conn_zone $binary_remote_addr zone=astrobaas_conn:10m;
#
# Credential stuffing is the one case worth limiting tightly at the edge. The
# app already throttles logins (10 per 15 minutes, per account AND per IP); this
# is a coarser backstop in front of it. 30r/m is generous enough for a whole
# office behind one NAT address to sign in.
#
#   limit_req_zone $binary_remote_addr zone=astrobaas_login:10m rate=30r/m;
#
# Routes nobody needs to call often — a backup restore, a WordPress import, a
# public health probe. Each is either expensive or pointless to repeat.
#
#   limit_req_zone $binary_remote_addr zone=astrobaas_rare:1m rate=10r/m;

# ─────────────────────────────────────────────────────────────────────────────
# The app, as an upstream with idle keep-alive connections.
#
# A bare `proxy_pass http://127.0.0.1:3002` opens a NEW TCP connection for
# every request and closes it afterwards. A catalogue page view is ~450
# requests, so that is ~450 handshakes and ~450 sockets left in TIME_WAIT for
# two minutes each — per visitor. Keep-alive reuses a small pool instead.
#
# It only works together with `proxy_http_version 1.1` and an EMPTY Connection
# header, both set at server level below; without them nginx speaks HTTP/1.0
# upstream and closes the connection anyway.
#
# The name must be unique across every vhost nginx loads: two sites on one box
# that both copied this file as-is make nginx refuse to start with "duplicate
# upstream". Name it after the hostname.
# ─────────────────────────────────────────────────────────────────────────────
upstream astrobaas_cms_example_com {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.example.com;
    server_tokens off;

    # ACME first, then redirect. Ordering matters: a blanket redirect on / would
    # bounce the challenge and certificate renewal would fail silently, months
    # after anyone remembers writing this.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1. On Debian 12 (nginx 1.22) and Ubuntu 24.04 (nginx 1.24)
    # delete this line and write `listen 443 ssl http2;` above instead —
    # `http2 on;` is an unknown directive there and nginx will refuse to start.
    http2 on;
    server_name cms.example.com;

    ssl_certificate     /etc/letsencrypt/live/cms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.example.com/privkey.pem;

    # --- TLS ------------------------------------------------------------------
    #
    # Mozilla's "intermediate" profile: TLS 1.2 and 1.3 only, forward-secret
    # AEAD ciphers. TLS 1.0/1.1 are refused by every current browser anyway;
    # leaving them on only helps a downgrade.
    #
    # If this server block also has certbot's
    # `include /etc/letsencrypt/options-ssl-nginx.conf;`, DELETE the six lines
    # below — that file sets the same directives, and the same directive twice
    # in one block stops nginx from starting.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:astrobaas_tls:10m;
    ssl_session_timeout 1d;
    # Tickets are encrypted with a key nginx never rotates on its own, which
    # quietly undoes forward secrecy for every session until the next restart.
    ssl_session_tickets off;

    # No nginx version in the Server header or in error pages.
    server_tokens off;

    # HSTS is deliberately NOT set here.
    #
    # It cannot be undone client-side: a browser that has seen it will refuse
    # plain HTTP for max-age seconds no matter what you change. Turn it on only
    # once TLS covers every hostname this site answers on, and turn it on in ONE
    # place — the app has HSTS_MAX_AGE for exactly this, and setting both sends
    # the header twice.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The app already sets X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy and a hash-based CSP on every response.
    # Do NOT repeat them here: nginx's add_header does not replace an upstream
    # header, it appends a second one, and two conflicting CSP headers are
    # intersected by the browser — which is how a working site suddenly stops
    # loading its own scripts.

    # Default body limit mirrors the app's own BODY_LIMIT_DEFAULT
    # (src/lib/body-limits.ts). nginx's own default is 1 MB, which rejects every
    # image upload with a 413 the app never sees.
    #
    # EVERY ROUTE THAT ACCEPTS MORE THAN THIS NEEDS ITS OWN LOCATION BELOW.
    # A route that is missing one inherits this 2m and 413s here, before the app
    # can explain why — which is precisely how a working video upload became a
    # broken one in production. tests/body-limits.test.mjs reads this file and
    # fails the build if any of them is missing or too small, so if you raise a
    # cap in the app and forget this file, CI tells you which line to change.
    client_max_body_size 2m;

    # --- Slow clients ---------------------------------------------------------
    #
    # A slow UPLOAD over a phone connection is not an attack, so the body
    # timeout stays generous (and the upload routes raise it further). A client
    # that takes more than 15 seconds to send its HEADERS is: that is the
    # slowloris pattern, holding a connection open a byte at a time so that a
    # few hundred of them exhaust the worker's connection slots.
    client_body_timeout 60s;
    client_header_timeout 15s;
    # How long an idle keep-alive connection is held. Long enough for a browser
    # to reuse it between the requests of one page, short enough that idle
    # sockets do not pile up (nginx's default is 75s).
    keepalive_timeout 30s;
    # Between two successive writes to a client, not for the whole response —
    # a large download over a slow link is fine; a client that stops reading is
    # dropped.
    send_timeout 30s;
    # Bounded, and roomier than nginx's 4 x 8k default: a session cookie plus
    # a CSRF cookie plus a storefront's own cookies can pass 8k, and the
    # failure is a bare 400 "Request Header Or Cookie Too Large".
    large_client_header_buffers 4 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # --- Rate-limit answers ---------------------------------------------------
    #
    # 429, not nginx's default 503. A client reads 503 as "the server is down";
    # 429 is the one status that means "slow down", and it is what the app's
    # own limiter answers, so a storefront needs one rule for both layers. It
    # also keeps edge rejections apart from the maintenance page and a failing
    # health check in the access log — which is what fail2ban reads
    # (deploy/fail2ban/).
    limit_req_status 429;
    limit_conn_status 429;

    # --- Compression ----------------------------------------------------------
    #
    # The app does not compress its responses; this is the only place it
    # happens. JSON from /api/products and the rendered HTML shrink by 80-90%.
    # Images and video are already compressed and are left alone (they are not
    # in gzip_types). text/html is always included by nginx.
    #
    # BREACH (compression + a secret in the body + attacker-reflected input)
    # does not bite the admin as built: the session and CSRF tokens travel in
    # cookies and headers, not in the page body.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/manifest+json image/svg+xml;

    # --- Real client IP behind a CDN (Cloudflare) -------------------------------
    #
    # Behind Cloudflare, every request reaches nginx from a Cloudflare address.
    # Without the lines below, $remote_addr is that address: every visitor
    # shares a handful of rate-limit buckets (so one busy region locks out
    # everyone in it), fail2ban bans Cloudflare, and the app's login throttle
    # counts every shopper as the same person.
    #
    # With them, nginx replaces $remote_addr with the visitor's address — but
    # ONLY for requests that really come from a Cloudflare range, so nobody else
    # can set CF-Connecting-IP and pick their own address. Everything below
    # (limit_req, X-Real-IP, X-Forwarded-For) then sees the real client.
    #
    # The ranges change: take them from https://www.cloudflare.com/ips-v4 and
    # /ips-v6, and refresh them. Firewall the origin so ONLY those ranges can
    # reach 443 (deploy/README.md, "Hardening"), or the CDN is optional for an
    # attacker. (Requires ngx_http_realip_module; Debian/Ubuntu builds have it.)
    #
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # ... every range from the two lists above ...
    # real_ip_header CF-Connecting-IP;
    #
    # A different CDN or load balancer: the same two directives, with its
    # ranges and its header (often X-Forwarded-For, with `real_ip_recursive on;`).

    # --- Proxy headers, ONCE, for every location ---------------------------------
    #
    # Set here and NOWHERE ELSE. nginx's inheritance is all-or-nothing: a
    # location that sets even one proxy_set_header of its own silently drops
    # every one of these. tests/deploy-artifacts.test.mjs fails if a location
    # sets one.
    proxy_http_version 1.1;
    # Empty, so nginx does not send "Connection: close" upstream — the other
    # half of the upstream keep-alive above.
    proxy_set_header Connection "";

    # Host must be the PUBLIC hostname. The app builds absolute URLs (canonical
    # tags, the sitemap, password-reset links, and — since the media-URL work —
    # the base it publishes for uploaded images) from the request origin when
    # no explicit setting is configured. Without this they all say
    # 127.0.0.1:3002.
    proxy_set_header Host $host;

    # The app reads the RIGHT-most X-Forwarded-For entry, on the assumption of
    # exactly one trusted proxy, and only when TRUST_PROXY=1.
    # $proxy_add_x_forwarded_for appends nginx's view of the peer to whatever
    # the client sent, which is the pairing that makes the right-most entry
    # trustworthy. Do not write $remote_addr here.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    access_log /var/log/nginx/cms.example.com.access.log;
    error_log  /var/log/nginx/cms.example.com.error.log;

    # --- Serving uploads directly ------------------------------------------
    #
    # IMAGES ONLY, and by extension.
    #
    # The app's own /uploads route reads each file into memory and returns it
    # whole; nginx gets sendfile, Range requests and its own ETag, which matters
    # because a catalogue page view asks for hundreds of images.
    #
    # But that route also does something nginx cannot: it decides the
    # Content-Type from a nine-extension allow-list and serves anything else as
    # an attachment. Handing nginx the whole directory would mean an uploaded
    # .html or .svg is served inline from this origin. So the image extensions —
    # the hot path, and the ones that cannot be scripted — are served here, and
    # everything else falls through to the app.
    #
    # The alias MUST point at the runtime uploads directory in shared/, never at
    # a release's dist/client/uploads: that is a build-time snapshot, and every
    # file uploaded since the build would 404.
    location ~* ^/uploads/.+\.(?:webp|avif|jpe?g|png|gif)$ {
        # `root`, not `alias`. With root, nginx appends the whole request path,
        # so UPLOADS_DIR must be <root>/uploads — which is the layout deploy.sh
        # already creates. alias inside a regex location needs a capture and
        # interacts badly with try_files; this form has neither problem.
        #
        # Form attachments live in shared/data/private-uploads, beside this
        # directory and NOT under it; this location's regex only ever maps to
        # <root>/uploads/..., so they are not reachable from here.
        root /var/www/cms-example-com/shared/data;

        # Uploaded filenames are content-addressed (a hash of the bytes), so the
        # same URL can never mean different bytes. That is what makes
        # `immutable` correct here rather than a caching bug waiting to happen.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        # A file nginx cannot find goes to the app rather than 404ing here: on a
        # fresh cutover the shared directory may not be populated yet, and the
        # app can still serve from its own UPLOADS_DIR.
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://astrobaas_cms_example_com;
    }

    # Everything else under /uploads/ — PDFs, text, anything unrecognised — goes
    # to the app, which knows how to refuse to render it.
    location /uploads/ {
        proxy_pass http://astrobaas_cms_example_com;
    }

    # --- Large bodies -------------------------------------------------------
    #
    # Each cap below is the app's own ceiling for that route, rounded UP to the
    # next megabyte. Never round down: a proxy one byte below the app refuses a
    # request the app would have accepted, with a bare 413 and nothing in the
    # app's log to explain it.
    #
    # These are ALSO the sizes an operator pays for. A 111m upload route means a
    # single authenticated request can occupy that much of the proxy's temp disk
    # while it buffers. That is the cost of self-hosted video, and it is why the
    # video ceiling is an env var (MEDIA_MAX_VIDEO_MB) rather than a constant:
    # a shop that does not want 100 MB videos should lower it in BOTH places.

    location = /api/media/upload {
        # <- MAX_VIDEO_SIZE * 1.1 (src/lib/media/ingest.ts, MEDIA_MAX_VIDEO_MB)
        # 100 MB of video plus multipart overhead. It was 12m here for as long
        # as the app allowed 10 MB images; video raised the app's ceiling
        # tenfold and this line did not move, so every video upload died at
        # nginx with a 413 the editor could not explain and the app never saw.
        client_max_body_size 111m;
        limit_req zone=astrobaas_general burst=1000 nodelay;
        # A 100 MB upload over a domestic connection takes minutes. The server
        # defaults of 60s would cut it off part-way and leave the editor with a
        # failed upload and no reason.
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://astrobaas_cms_example_com;
        proxy_request_buffering on;
    }

    # A replacement IS an upload, and had no location at all — so it inherited
    # the 2m default and refused anything bigger than a photograph.
    location = /api/media/replace {
        # <- MAX_VIDEO_SIZE * 1.1 (src/lib/media/ingest.ts, MEDIA_MAX_VIDEO_MB)
        client_max_body_size 111m;
        limit_req zone=astrobaas_general burst=1000 nodelay;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://astrobaas_cms_example_com;
        proxy_request_buffering on;
    }

    # The two heaviest routes the app has: each request is hundreds of
    # megabytes to parse and write. Authenticated, but a stolen or scripted
    # session should not be able to queue them back to back, so they get the
    # `rare` zone — a restore or an import is a few requests a day.
    location = /api/backup/import {
        # <- MAX_ARCHIVE_BYTES * 1.1 (src/lib/backup/offsite.ts)
        # Was 64m while the app allowed 256 MB, so a shop restoring its own
        # backup was refused by the proxy.
        client_max_body_size 282m;
        limit_req zone=astrobaas_rare burst=5 nodelay;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://astrobaas_cms_example_com;
    }

    # A WordPress WXR export. Above the app's own file cap the answer is the
    # CLI — but that message is written by the app, and it cannot write it if
    # nginx refuses the request first. (A rehearsal and an import are two
    # requests; burst=5 leaves room to retry both.)
    location = /api/import/wordpress {
        # <- IMPORT_BODY_LIMIT (src/lib/import/limits.ts)
        client_max_body_size 26m;
        limit_req zone=astrobaas_rare burst=5 nodelay;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://astrobaas_cms_example_com;
    }

    # A file attached to a public form, by an anonymous visitor. The only
    # large-body route on this list that is NOT authenticated, which is why it
    # has the smallest cap and keeps the general rate-limit zone.
    location ~ ^/api/forms/[^/]+/upload/?$ {
        # <- MAX_SUBMISSION_FILE_SIZE * 1.2 (src/lib/media/private-files.ts)
        client_max_body_size 6m;
        limit_req zone=astrobaas_general burst=20 nodelay;
        proxy_pass http://astrobaas_cms_example_com;
    }

    # --- Signing in ---------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=astrobaas_login burst=20 nodelay;
        proxy_pass http://astrobaas_cms_example_com;
    }

    # --- Restricting the admin to known addresses (optional) -------------------
    #
    # If the shop's staff work from fixed addresses (an office, a VPN), the admin
    # UI does not need to be reachable from anywhere else. Uncomment and list
    # them. This is a second lock, not the first: sessions, the login throttle
    # and 2FA still apply to whoever is allowed through.
    #
    # Only the /admin PAGES. The /api/ routes are shared with the storefront
    # and cannot be restricted wholesale. The sign-in page below (and the same
    # allow/deny lines added to the /api/auth/login location above) can be —
    # but ONLY if staff are the only people who sign in on this host. Anyone
    # else with an account here (an author, a customer) is locked out with
    # them. A headless storefront authenticates with an API key and is not
    # affected either way.
    #
    # Behind Cloudflare this only works with the real-IP lines above enabled —
    # otherwise every request "comes from" Cloudflare.
    #
    # location ^~ /admin {
    #     allow 203.0.113.10;       # office
    #     allow 2001:db8::/48;      # office, IPv6
    #     deny all;
    #     proxy_pass http://astrobaas_cms_example_com;
    # }
    # location = /login {
    #     allow 203.0.113.10;
    #     allow 2001:db8::/48;
    #     deny all;
    #     proxy_pass http://astrobaas_cms_example_com;
    # }

    # --- Ops ----------------------------------------------------------------
    #
    # /metrics is unauthenticated by design (a scraper cannot hold a session).
    # If METRICS_ENABLED=1, it must not be reachable from the internet.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://astrobaas_cms_example_com;
    }

    # Readiness is an orchestration signal — "send traffic here yet?" — and
    # nothing on the internet has a use for it. deploy.sh asks the app
    # directly on 127.0.0.1:<port>, not through here. It is also the probe that
    # reads storage on every call. Add the address of a load balancer or
    # monitor that genuinely needs it.
    location = /readyz {
        allow 127.0.0.1;
        allow ::1;
        # allow 203.0.113.20;   # a load balancer / uptime monitor
        deny all;
        proxy_pass http://astrobaas_cms_example_com;
    }

    # Liveness stays PUBLIC, because external uptime monitors use it. It is
    # cheap in the app (one cached read at most every two seconds), and this
    # limit keeps a flood of it off the upstream entirely: 10 a minute per
    # address is ample for a monitor polling every 30 seconds.
    location = /healthz {
        limit_req zone=astrobaas_rare burst=10 nodelay;
        proxy_pass http://astrobaas_cms_example_com;
    }

    # --- Everything else ----------------------------------------------------
    location / {
        limit_req zone=astrobaas_general burst=1000 nodelay;
        # A browser opens a handful of connections and reuses them. 64 is far
        # above that and far below what a flood needs.
        limit_conn astrobaas_conn 64;

        proxy_pass http://astrobaas_cms_example_com;
        proxy_buffering on;

        # When the app is down or being deployed, serve the maintenance page
        # with a 503 — never a 200. A holding page served as 200 tells a crawler
        # THAT is the content now, and shops have lost rankings to it.
        proxy_intercept_errors on;
        # 502 and 504 ONLY. Deliberately NOT 503.
        #
        # nginx cannot tell its own error from the app's, and the app produces
        # 503 on purpose in three cases that matter: its own maintenance window,
        # a failing /api/health/deep, and a /readyz while it drains for a
        # restart. Intercepting 503 replaced those with this static page — so a
        # deploy script asserting the health check got an HTML holding page
        # instead of the JSON naming which check failed, and could never see the
        # reason. (Verified: it really did.)
        #
        # An app that is genuinely down gives nginx a 502 (connection refused)
        # or a 504 (timeout). Those are nginx's own, and those are the ones to
        # replace.
        #
        # `=503` sets the status the visitor sees. A holding page served as 200
        # tells a crawler that this is the content now, and shops have lost
        # rankings to exactly that.
        error_page 502 504 =503 /maintenance.html;
    }

    location = /maintenance.html {
        # NOT inside the release directory. This has to be readable while the
        # app is stopped and while `current` is being swapped. deploy.sh ships a
        # fresh copy here with every release (npm run build:maintenance-page).
        root /var/www/cms-example-com/shared/maintenance;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 120 always;
    }
}
