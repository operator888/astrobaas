# AstroBaaS — fail2ban filter: an address that keeps getting 429s.
#
#   sudo cp astrobaas-429.conf /etc/fail2ban/filter.d/
#   sudo fail2ban-regex /var/log/nginx/cms.example.com.access.log /etc/fail2ban/filter.d/astrobaas-429.conf
#
# Reads the nginx ACCESS log (the default "combined" format), so it catches
# both layers with one rule: nginx's own edge limit (limit_req_status 429 in
# the reference vhost) and the app's per-IP limiter, which also answers 429
# and which nginx logs like any other response.
#
# 429 ONLY, deliberately not 503. The reference vhost answers its own limit
# with 429, so a 503 no longer means "rate limited" — it means the maintenance
# page, a deploy in progress, a draining process or a failing health check.
# All of those hit every visitor at once, and a jail that bans on them bans
# your customers during your own deploy.
#
# The timestamp is found by fail2ban's default date detection and cut out of
# the line before matching (fail2ban >= 0.10), which is why the brackets are
# empty — the same convention as the stock nginx-botsearch filter.
#
# Behind Cloudflare, <HOST> is only the visitor if the vhost's real-IP lines
# are enabled; otherwise every line names a Cloudflare edge. See jail.d.

[Definition]

failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ [^"]*" 429 \d+

ignoreregex =
